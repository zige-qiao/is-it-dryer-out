<!doctype html><html lang="en"><meta charset="utf-8"><title>Camera recognition photo regression</title>
<h1>Camera recognition photo regression</h1><p id="status" role="status">Loading supplied photo…</p><canvas id="source" role="img" aria-label="Current readings fixture"></canvas><pre id="result"></pre>
<p>This browser-only check uses a local, untracked fixture at tests/fixtures/camera-monitor.jpg. Copy the supplied photo there before running it. It is not an album-upload feature.</p>
<script type="module">
import { createRecognitionService, cropCanvas } from '../src/camera/recognition.js';
import { initialCrops } from '../src/camera/readings.js';
const status = document.querySelector('#status');
try {
  const image = new Image(); image.src = './fixtures/camera-monitor.jpg'; await image.decode();
  const source = document.querySelector('#source'); source.width = 730; source.height = 206;
  source.getContext('2d').drawImage(image, 80, 300, 730, 206, 0, 0, 730, 206);
  const crops = initialCrops(), service = createRecognitionService();
  const result = await service.recognise({ temperature: cropCanvas(source, crops.temperature), humidity: cropCanvas(source, crops.humidity) }, text => status.textContent = text);
  const passed = result.temperature === '22.3' && result.humidity === '59';
  document.querySelector('#result').textContent = JSON.stringify(result);
  status.textContent = passed ? 'PASS: 22.3°C and 59%, excluding low/high records.' : 'FAIL: readings differ from the photo.';
} catch(error) { status.textContent = 'FAIL: recognition did not finish.'; document.querySelector('#result').textContent = String(error); }
</script></html>
